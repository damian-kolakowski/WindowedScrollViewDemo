name: WindowedScrollViewDemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

targets:
  WindowedScrollViewDemo:
    type: application
    platform: iOS
    sources:
      - path: WindowedScrollViewDemo
    dependencies:
      - sdk: libsqlite3.tbd
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: "Windowed Scroll Demo"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.windowedscrollviewdemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
